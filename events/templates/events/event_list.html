<h1>Upcoming Events</h1>
<ul>
  {% for event in events %}
    <li>
      <a href="{% url 'event_detail' event.id %}">{{ event.title }}</a>
      — {{ event.start_time }} at {{ event.venue.name }} ({{ event.get_status_display }})
    </li>
  {% empty %}
    <li>No events yet.</li>
  {% endfor %}
</ul>
